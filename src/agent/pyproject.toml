[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhidiao-agent"
version = "0.5.0"
description = "AI agent interfaces for the Zhidiao hardware workflow"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
zhidiao-agent = "zhidiao_agent.cli:main"
zhidiao-ui = "zhidiao_agent.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
