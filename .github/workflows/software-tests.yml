name: software-tests
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B sim/check_release.py
      - run: python -B -m unittest discover -s tests -v
        working-directory: src/agent
        env:
          PYTHONPATH: src
